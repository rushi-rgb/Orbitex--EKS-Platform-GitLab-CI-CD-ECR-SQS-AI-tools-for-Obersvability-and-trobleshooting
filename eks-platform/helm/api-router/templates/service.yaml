apiVersion: v1
kind: Service
metadata:
  name: api-router
  namespace: {{ .Release.Namespace }}
  labels:
    app: api-router
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
  selector:
    app.kubernetes.io/name: api-router
