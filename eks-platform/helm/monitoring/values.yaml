################################################################################
# Monitoring Stack Helm Values
# Prometheus + Grafana + Loki + Tempo + Mimir
################################################################################

grafana:
  enabled: true
  adminPassword: changeme  # Override via --set or secret
  persistence:
    enabled: true
    size: 10Gi
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: platform
          orgId: 1
          folder: Platform
          type: file
          disableDeletion: false
          options:
            path: /var/lib/grafana/dashboards/platform
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: monitoring

prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 50Gi
    additionalScrapeConfigs:
      - job_name: platform-services
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [platform]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 2Gi

# CloudWatch agent for AWS-native alarms
cloudwatchAgent:
  enabled: true
  clusterName: ""  # Set at deploy time
