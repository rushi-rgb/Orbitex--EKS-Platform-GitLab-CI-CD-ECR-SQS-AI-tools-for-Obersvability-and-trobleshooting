        identityOwner: operator

---
# TriggerAuthentication — IRSA via pod identity
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-aws-credentials
  namespace: platform
spec:
  podIdentity:
    provider: aws-eks
